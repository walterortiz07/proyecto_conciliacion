<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingreso - {{ servicio }}</title>
<link rel="stylesheet" href="/estaticos/estilos.css">
</head>
<body class="centrado">
<form class="tarjeta" method="post" action="/login">
  <h1>{{ servicio }}</h1>
  <p class="tenue">Sistema de conciliacion con integridad verificable.
  Ingrese con su usuario.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label>Correo</label>
  <input type="email" name="email" required autofocus>
  <label>Clave</label>
  <input type="password" name="clave" required>
  <button type="submit">Ingresar</button>
</form>
</body>
</html>
